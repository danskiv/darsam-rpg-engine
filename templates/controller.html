<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darsam Dungeon Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0c0d12;
            color: #f1f5f9;
            touch-action: manipulation;
        }
        .font-cinzel {
            font-family: 'Cinzel', serif;
        }
        .choice-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 select-none pb-8">

    <!-- Mobile Top Header -->
    <header class="flex justify-between items-center bg-zinc-900/90 border border-zinc-800 p-3 rounded-2xl shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center text-lg font-bold text-black">
                ⚔️
            </div>
            <div>
                <h1 class="text-sm font-bold font-cinzel text-amber-400">Danas the Champion</h1>
                <p class="text-[10px] uppercase tracking-wider text-zinc-400">Dungeon Controller</p>
            </div>
        </div>

        <!-- Vital Stats Minimal -->
        <div class="flex space-x-3 text-xs font-bold">
            <div class="bg-red-950/60 border border-red-800/60 px-2.5 py-1 rounded-lg text-red-300">
                ❤️ <span id="m-hp">100</span>
            </div>
            <div class="bg-cyan-950/60 border border-cyan-800/60 px-2.5 py-1 rounded-lg text-cyan-300">
                ✨ <span id="m-mp">50</span>
            </div>
            <div class="bg-amber-950/60 border border-amber-800/60 px-2.5 py-1 rounded-lg text-amber-300">
                🪙 <span id="m-gold">25</span>
            </div>
        </div>
    </header>

    <!-- Location & Scene Title Preview -->
    <div class="my-3 text-center space-y-1">
        <p id="m-location" class="text-[11px] font-bold text-amber-500 uppercase tracking-widest">📍 Bawah Tanah</p>
        <h2 id="m-title" class="text-lg font-bold font-cinzel text-zinc-100 line-clamp-1">Gerbang Kehancuran</h2>
    </div>

    <!-- Rolling Dice Modal Overlay -->
    <div id="m-dice-overlay" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-6 text-center space-y-4">
        <p class="text-xs uppercase tracking-widest text-amber-400 font-bold">MEMPROSES TAKDIR DADU...</p>
        <div id="m-dice-box" class="w-28 h-28 rounded-2xl bg-gradient-to-br from-amber-500 to-yellow-400 flex items-center justify-center text-5xl font-cinzel font-black text-black shadow-2xl animate-bounce">
            🎲
        </div>
        <p id="m-dice-text" class="text-sm font-semibold text-zinc-200">Menunggu lemparan dadu D20 di layar TV...</p>
    </div>

    <!-- Primary Choices Action Cards Grid -->
    <main class="space-y-3 flex-1 flex flex-col justify-center">
        <p class="text-[11px] font-bold tracking-widest uppercase text-zinc-400 px-1">PILIH TINDAKAN PADUKA:</p>
        <div id="m-choices-list" class="space-y-2.5">
            <!-- Populated Dynamically -->
        </div>

        <!-- Custom Action Accordion / Input -->
        <div class="pt-2 border-t border-zinc-800/80">
            <div class="flex space-x-2">
                <input id="m-custom-input" type="text" placeholder="Ketik aksi khusus Paduka..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500">
                <button onclick="sendCustomAction()" class="bg-amber-600 active:bg-amber-700 text-black font-bold text-xs px-4 py-2.5 rounded-xl font-cinzel">
                    KIRIM
                </button>
            </div>
        </div>
    </main>

    <!-- Bottom Controls -->
    <footer class="flex justify-between items-center text-[10px] text-zinc-400 pt-2 border-t border-zinc-900">
        <button onclick="resetGame()" class="text-red-400 hover:underline">🔄 Reset Petualangan</button>
        <span class="text-emerald-400 font-semibold">● Terhubung ke TV</span>
    </footer>

    <script>
        const wsUrl = `ws://${window.location.host}/ws/controller`;
        let socket;
        let currentChoices = [];

        function connect() {
            socket = new WebSocket(wsUrl);
            socket.onopen = () => console.log("Controller WebSocket Connected!");
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            socket.onclose = () => {
                console.log("Socket closed, reconnecting...");
                setTimeout(connect, 2000);
            };
        }

        function handleMessage(data) {
            if (data.type === "init" || data.type === "state_update") {
                hideDice();
                updateUI(data.state);
            } else if (data.type === "dice_rolling") {
                showDice(data.choice_text);
            } else if (data.type === "dice_result") {
                showDiceResult(data.value);
            }
        }

        function updateUI(state) {
            const p = state.player;
            const s = state.scene;

            document.getElementById('m-hp').innerText = p.hp;
            document.getElementById('m-mp').innerText = p.mp;
            document.getElementById('m-gold').innerText = p.gold;

            document.getElementById('m-location').innerText = `📍 ${s.location}`;
            document.getElementById('m-title').innerText = s.title;

            currentChoices = s.choices;
            const container = document.getElementById('m-choices-list');
            container.innerHTML = '';

            s.choices.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "choice-btn w-full text-left p-3.5 rounded-xl bg-zinc-900/90 border border-zinc-800 flex items-center space-x-3 transition-transform active:scale-[0.98] shadow";
                btn.onclick = () => selectChoice(c);
                
                const isRoll = c.type === 'roll';
                const badgeColor = isRoll ? 'bg-amber-500/20 border-amber-500/40 text-amber-300' : 'bg-blue-500/20 border-blue-500/40 text-blue-300';
                
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-lg ${badgeColor} font-cinzel font-bold text-sm flex items-center justify-center border flex-shrink-0">${c.id}</span>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-semibold text-zinc-100 leading-snug">${c.text}</p>
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        function selectChoice(choice) {
            if (navigator.vibrate) navigator.vibrate(30);
            socket.send(JSON.stringify({
                type: "select_choice",
                choice: choice
            }));
        }

        function sendCustomAction() {
            const input = document.getElementById('m-custom-input');
            const text = input.value.trim();
            if (!text) return;
            if (navigator.vibrate) navigator.vibrate(50);
            socket.send(JSON.stringify({
                type: "custom_action",
                text: text
            }));
            input.value = '';
        }

        function showDice(text) {
            document.getElementById('m-dice-overlay').classList.remove('hidden');
            document.getElementById('m-dice-text').innerText = text;
            const box = document.getElementById('m-dice-box');
            box.innerText = "🎲";
            box.className = "w-28 h-28 rounded-2xl bg-gradient-to-br from-amber-500 to-yellow-400 flex items-center justify-center text-5xl font-cinzel font-black text-black shadow-2xl animate-bounce";
        }

        function showDiceResult(val) {
            const box = document.getElementById('m-dice-box');
            box.classList.remove('animate-bounce');
            box.innerText = val;
            if (val === 20) {
                box.className = "w-28 h-28 rounded-2xl bg-gradient-to-br from-emerald-500 to-green-600 flex items-center justify-center text-5xl font-cinzel font-black text-white shadow-2xl scale-105";
                document.getElementById('m-dice-text').innerText = "🔥 CRITICAL SUCCESS! (20)";
            } else if (val === 1) {
                box.className = "w-28 h-28 rounded-2xl bg-gradient-to-br from-red-600 to-rose-900 flex items-center justify-center text-5xl font-cinzel font-black text-white shadow-2xl scale-105";
                document.getElementById('m-dice-text').innerText = "💀 CRITICAL FAIL! (1)";
            } else if (val >= 10) {
                box.className = "w-28 h-28 rounded-2xl bg-gradient-to-br from-blue-600 to-cyan-500 flex items-center justify-center text-5xl font-cinzel font-black text-white shadow-2xl scale-105";
                document.getElementById('m-dice-text').innerText = `⚔️ SUCCESS (${val})`;
            } else {
                box.className = "w-28 h-28 rounded-2xl bg-gradient-to-br from-zinc-700 to-zinc-900 flex items-center justify-center text-5xl font-cinzel font-black text-red-400 border border-red-500/40";
                document.getElementById('m-dice-text').innerText = `⚠️ FAIL (${val})`;
            }
        }

        function hideDice() {
            document.getElementById('m-dice-overlay').classList.add('hidden');
        }

        function resetGame() {
            if (confirm("Mulai ulang petualangan dari awal?")) {
                socket.send(JSON.stringify({ type: "reset_game" }));
            }
        }

        connect();
    </script>
</body>
</html>
